[package]
name = "opfile_core"
version = "2.0.0"
edition = "2021"
description = "OPfile high-performance offline Rust core for file management, archiving, and 255+ format conversion"

[lib]
name = "opfile_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "fs"] }
rayon = "1.10"
dashmap = "6.1"
walkdir = "2.5"
natord = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
csv = "1.3"
quick-xml = "0.37"
pulldown-cmark = "0.12"
unicode-normalization = "0.1"
regex = "1.11"
memmap2 = "0.9"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
blake3 = "1.5"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
brotli = "7.0"
crc32fast = "1.4"

# Archive & compression engines
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "zstd", "aes-crypto", "time"] }
sevenz-rust = { version = "0.6", features = ["aes256"] }
tar = "0.4"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
bzip2 = "0.5"
xz2 = "0.1"
zstd = "0.13"

# Media, image, vector, PDF, spreadsheet, audio engines
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff", "tga", "qoi", "pnm", "hdr"] }
resvg = "0.44"
lopdf = "0.34"
symphonia = { version = "0.5", features = ["all"] }
hound = "3.5"
calamine = "0.28"
rust_xlsxwriter = "0.81"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
